services:
  - type: web
    name: backclinica-api
    runtime: docker
    plan: free
    region: oregon
    branch: despliegue-seguridad
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://backclinica-web.onrender.com
      - key: JWT_PUBLIC_KEY_LOCATION
        value: file:/etc/secrets/public.pem

  - type: web
    name: backclinica-auth
    runtime: docker
    rootDir: auth-service
    plan: free
    region: oregon
    branch: despliegue-seguridad
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: AUTH_DB_URL
        sync: false
      - key: AUTH_DB_USERNAME
        sync: false
      - key: AUTH_DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://backclinica-web.onrender.com
      - key: JWT_PRIVATE_KEY
        value: file:/etc/secrets/private.pem
      - key: JWT_PUBLIC_KEY
        value: file:/etc/secrets/public.pem

  - type: web
    name: backclinica-web
    runtime: static
    rootDir: frontend
    branch: despliegue-seguridad
    buildCommand: npm ci && npm run build:render
    staticPublishPath: dist/clinica/browser
    envVars:
      - key: API_URL
        value: https://backclinica-api.onrender.com/api
      - key: AUTH_URL
        value: https://backclinica-auth.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
