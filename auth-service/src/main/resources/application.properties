spring.application.name=auth-service
server.port=${PORT:${SERVER_PORT:8081}}
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
security.jwt.private-key=${JWT_PRIVATE_KEY:file:./keys/private.pem}
security.jwt.public-key=${JWT_PUBLIC_KEY:file:./keys/public.pem}
security.jwt.expiration=${JWT_EXPIRATION_SECONDS:3600}
